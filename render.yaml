# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: knobble
    runtime: node
    # A persistent disk (below) requires a paid instance type. Without it the app
    # still works, but rooms and uploaded photos are lost on every deploy/restart.
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"
      # Access key for the /stats page; Render generates a random value (see the Environment tab).
      - key: STATS_TOKEN
        generateValue: true
      # Once you have a domain, also set PUBLIC_URL (e.g. https://knobble.app) so link previews
      # and the sitemap use it instead of the request host.
    disk:
      name: jigsaw-data
      mountPath: /var/data
      sizeGB: 1
